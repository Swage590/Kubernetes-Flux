apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rbd.csi.ceph.com
parameters:
  clusterID: "6f1b27de-7ad8-4953-91e0-a8fe3acec547"
  pool: "ceph-k3s-pool"
  imageFeatures: "layering"
  csi.storage.k8s.io/provisioner-secret-name: "csi-rbd-secret"
  csi.storage.k8s.io/provisioner-secret-namespace: "default"
  csi.storage.k8s.io/controller-expand-secret-name: "csi-rbd-secret"
  csi.storage.k8s.io/controller-expand-secret-namespace: "default"
  csi.storage.k8s.io/node-stage-secret-name: "csi-rbd-secret"
  csi.storage.k8s.io/node-stage-secret-namespace: "default"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cephfs-k3s
provisioner: cephfs.csi.ceph.com
parameters:
  clusterID: "6f1b27de-7ad8-4953-91e0-a8fe3acec547"
  fsName: "cephfs"
  pool: "cephfs_data"
  csi.storage.k8s.io/provisioner-secret-name: "csi-cephfs-k3s-secret"
  csi.storage.k8s.io/provisioner-secret-namespace: "default"
  csi.storage.k8s.io/controller-expand-secret-name: "csi-cephfs-k3s-secret"
  csi.storage.k8s.io/controller-expand-secret-namespace: "default"
  csi.storage.k8s.io/node-stage-secret-name: "csi-cephfs-k3s-secret"
  csi.storage.k8s.io/node-stage-secret-namespace: "default"
reclaimPolicy: Retain
allowVolumeExpansion: true
