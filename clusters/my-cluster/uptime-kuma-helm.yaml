apiVersion: v1
kind: PersistentVolume
metadata:
  name: uptime-kuma-cephfs-pv
spec:
  capacity:
    storage: 4Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    volumeHandle: 0001-0024-6f1b27de-7ad8-4953-91e0-a8fe3acec547-0000000000000001-uptime-kuma
    nodeStageSecretRef:
      name: csi-cephfs-k3s-secret
      namespace: default
    volumeAttributes:
      clusterID: "6f1b27de-7ad8-4953-91e0-a8fe3acec547"
      fsName: "cephfs"
      staticVolume: "true"
      rootPath: "/k3s/uptime-kuma"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-cephfs-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 4Gi
  volumeName: uptime-kuma-cephfs-pv
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: uptime-kuma
  namespace: default
spec:
  interval: 30m
  url: https://dirsigler.github.io/uptime-kuma-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: uptime-kuma
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
  values:
    image:
      repository: "louislam/uptime-kuma"
      tag: "2"

    mariadb:
      enabled: false

    volume:
      enabled: false

    additionalVolumes:
      - name: uptime-kuma-storage
        persistentVolumeClaim:
          claimName: uptime-kuma-cephfs-pvc

    additionalVolumeMounts:
      - name: uptime-kuma-storage
        mountPath: "/app/data"

    extraVolumes: []
    extraVolumeMounts: []

    ingress:
      enabled: true
      className: traefik
      annotations:
        kubernetes.io/ingress.class: traefik
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      extraLabels: {}
      hosts:
        - host: status.swages.cloud
          paths:
            - path: /
              pathType: Prefix
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: helm-uptime-kuma
  namespace: flux-system
spec:
  providerRef:
    name: discord-flux-chan
  eventSeverity: info
  eventSources:
  - kind: HelmRepository
    name: uptime-kuma
  - kind: HelmChart
    name: default-uptime-kuma
  - kind: HelmRelease
    name: uptime-kuma
    namespace: default
 
