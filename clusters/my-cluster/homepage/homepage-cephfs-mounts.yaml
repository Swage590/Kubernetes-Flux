---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homepage-icons-cephfs-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    volumeHandle: homepage-icons-cephfs
    nodeStageSecretRef:
      name: csi-cephfs-k3s-secret
      namespace: default
    volumeAttributes:
      clusterID: "6f1b27de-7ad8-4953-91e0-a8fe3acec547"
      fsName: "cephfs"
      rootPath: "/k3s/homepage/icons"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homepage-icons-cephfs-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: homepage-icons-cephfs-pv
