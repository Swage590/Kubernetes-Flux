apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config-settings
  namespace: default # Make sure to use the correct namespace
data:
  settings.yaml: |
    cardBlur: md
    color: green
    background: /images/mini-rack.jpg
    favicon: /images/favicon.png
    layout:
      - Websites & Services:
          columns: 4
          style: row
      - Backend:
          columns: 4
          style: row
      - Physical Hardware:
          columns: 3
          style: row
      - Virtual Machines:
          columns: 4
          style: row
    theme: dark
    title: Swage's Homepage
